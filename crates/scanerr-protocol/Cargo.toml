[package]
name = "scanerr-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
maxminddb = "0.24"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "gzip"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
x509-parser = "0.17"
