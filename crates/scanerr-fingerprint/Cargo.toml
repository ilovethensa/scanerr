[package]
name = "scanerr-fingerprint"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
regex = "1"
scanerr-protocol = { path = "../scanerr-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
