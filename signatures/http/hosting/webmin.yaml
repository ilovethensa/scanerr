id: webmin
name: Webmin
category: hosting
tags: [server-management, control-panel]
priority: 80
condition: any
matchers:
  - field: http.header.server
    op: equals
    value: MiniServ
    weight: 10
  - field: http.title
    op: contains
    value: Document follows
    weight: 5
  - field: http.body
    op: contains
    value: err-head
    weight: 4
