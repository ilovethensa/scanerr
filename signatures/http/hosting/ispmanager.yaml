id: ispmanager
name: ISPmanager
category: hosting
tags: [hosting, control-panel, server-management]
priority: 80
condition: any
matchers:
  - field: http.body
    op: contains
    value: ispmgr
    weight: 10
  - field: http.cookie
    op: contains
    value: ispmgrlang
    weight: 8
  - field: http.body
    op: contains
    value: isp-fullscreen-body
    weight: 7
