id: nvr-web
name: NVR/DVR Web Interface
category: camera
tags: [camera, surveillance, iot, nvr]
priority: 85
condition: any
matchers:
  - field: http.body
    op: contains
    value: SD-GAUSS
    weight: 6
  - field: http.body
    op: contains
    value: PlatformConfig-GAVI
    weight: 4
  - field: http.body
    op: contains
    value: Preview-component-FishEye
    weight: 7
  - field: http.body
    op: contains
    value: FaceFind-FaceRecognition
    weight: 7
  - field: http.body
    op: contains
    value: RadarLink-RadarLocation
    weight: 6
