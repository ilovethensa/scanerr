id: hikvision
name: Hikvision
category: camera
tags: [camera, surveillance, iot]
priority: 90
condition: any
matchers:
  - field: http.header.server
    op: equals
    value: Webs
    weight: 5
  - field: http.header.server
    op: startswith
    value: App-webs
    weight: 5
  - field: http.body
    op: contains
    value: /doc/page/login.asp
    weight: 4
