id: hikvision
name: Hikvision
category: camera
tags: [camera, surveillance, iot]
priority: 90
condition: any
matchers:
  - field: http.header.server
    op: equals
    value: Webs
    weight: 5
  - field: http.header.server
    op: startswith
    value: App-webs
    weight: 5
  - field: http.body
    op: contains
    value: multiVideoActiveX
    weight: 8
  - field: http.body
    op: contains
    value: PluginEventHandler
    weight: 6
  - field: http.body
    op: icontains
    value: childDevID
    weight: 3
  - field: http.body
    op: contains
    value: "Access Error:"
    weight: 7
  - field: http.body
    op: contains
    value: "Can't locate document:"
    weight: 6
