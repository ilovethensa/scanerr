id: ip-camera-boa
name: IP Camera (Boa)
category: camera
tags: [camera, surveillance, iot]
priority: 90
condition: any
matchers:
  - field: http.header.www-authenticate
    op: icontains
    value: N2v2
    weight: 5
  - field: http.header.server
    op: startswith
    value: Boa/
    weight: 3
  - field: http.header.www-authenticate
    op: icontains
    value: "streaming_server"
    weight: 5
  - field: http.body
    op: contains
    value: "cgi-bin/viewer"
    weight: 6
  - field: http.body
    op: contains
    value: "getparam.cgi"
    weight: 5
