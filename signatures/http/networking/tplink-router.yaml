id: tplink-router
name: TP-Link Router
category: networking
tags: [router, networking, iot]
priority: 85
condition: any
matchers:
  - field: http.header.www-authenticate
    op: contains
    value: TP-LINK
    weight: 10
  - field: http.body
    op: contains
    value: tplinklogin.net
    weight: 9
  - field: http.body
    op: contains
    value: tplinkwifi.net
    weight: 8
  - field: http.body
    op: contains
    value: tpEncrypt.new.js
    weight: 8
  - field: http.body
    op: contains
    value: $.su.CHAR
    weight: 8
  - field: http.body
    op: contains
    value: tp-link.com/support
    weight: 7
  - field: http.body
    op: contains
    value: tp-link-tether
    weight: 6
  - field: http.body
    op: contains
    value: dynaform
    weight: 6
  - field: ssl.subject_cn
    op: equals
    value: tplinkwifi.net
    weight: 9
