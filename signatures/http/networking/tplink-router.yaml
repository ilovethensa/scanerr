id: tplink-router
name: TP-Link Router
category: networking
tags: [router, networking, iot]
priority: 85
condition: any
matchers:
  - field: http.header.www-authenticate
    op: contains
    value: TP-LINK
    weight: 25
  - field: http.body
    op: contains
    value: tplinklogin.net
    weight: 9
  - field: http.body
    op: contains
    value: tplinkwifi.net
    weight: 8
  - field: http.body
    op: contains
    value: tpEncrypt.new.js
    weight: 8
  - field: http.body
    op: contains
    value: AX80v1
    weight: 2
  - field: http.body
    op: contains
    value: $.su.language
    weight: 2
  - field: http.body
    op: contains
    value: tpEncrypt
    weight: 2
  - field: http.header.server
    op: equals
    value: Router Webserver
    weight: 2
