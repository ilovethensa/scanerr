[package]
name = "scanerr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scanerr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
ipnet = "2"
log = "0.4"
maxminddb = "0.24"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "json", "derive"] }
tera = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
