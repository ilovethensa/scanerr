[package]
name = "scanerr"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "scaner"
path = "src/scanner/main.rs"

[[bin]]
name = "status"
path = "src/status/main.rs"

[[bin]]
name = "discord"
path = "src/discord/main.rs"

[dependencies]
rand = "0.9.2"
rust_masscan = "0.1.7"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls-ring-native-roots", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
rust-mc-status = "1.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = "0.12.4"
poise = "0.6.1"
