[database]
url = "postgres://scanerr:scanerr@localhost/scanerr"

[scanner]
# Stage 1: Broad discovery (find alive hosts)
discovery_ports = [80, 443, 7547, 554, 22, 53, 8080, 179, 2000, 123, 23, 81, 1883, 5000, 8000, 8001, 8002, 8081, 8888, 37777]
discovery_rate = 1000

# Stage 2: Deep scan (top 200 TCP ports from nmap-services)
deep_scan_ports = ["1,3,7,9,13,17,19,21,22,23,25,26,37,53,79,80,81,82,88,100,106,110,111,113,119,135,139,143,144,179,199,254,255,280,311,389,427,443,444,445,464,465,497,513,514,515,543,544,548,554,587,593,625,631,636,646,787,808,873,902,990,993,995,1000,1022,1024,1025,1026,1027,1028,1029,1030,1031,1032,1033,1035,1036,1037,1038,1039,1040,1041,1044,1048,1049,1050,1053,1054,1056,1058,1059,1064,1065,1066,1069,1071,1074,1080,1110,1234,1433,1494,1521,1720,1723,1755,1761,1801,1900,1935,1993,1998,2000,2001,2002,2005,2049,2103,2105,2107,2121,2161,2301,2383,2401,2601,2717,2869,2967,3000,3001,3128,3268,3306,3389,3689,3690,3703,3986,4000,4001,4045,4899,5000,5001,5003,5009,5050,5051,5060,5101,5120,5190,5357,5432,5555,5631,5666,5800,5900,5901,6000,6001,6002,6004,6112,6646,7000,7070,7937,7938,8000,8002,8008,8009,8010,8031,8080,8081,8443,8888,9000,9001,9090,9100,9102,9999,10000,10001,10010,32768,32771,49152,49153,49154,49155,49156,49157,50000"]
deep_scan_rate = 1000

# Backpressure (Probe queue depth)
max_probe_queue_depth = 50000

# Honeypot detection: skip hosts with more than this many open ports
honeypot_port_threshold = 50

# Sweep: ranges per masscan invocation (streaming batch size)
sweep_chunk_size = 20

# How often to re-scan all ranges (seconds). Default: 3600 (1 hour)
sweep_interval_secs = 3600

ranges_file = "ranges.txt"

[probe]
concurrency = 128
timeout_secs = 5
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
geoip_db_path = "./GeoLite2-City.mmdb"
asn_db_path = "./GeoLite2-ASN.mmdb"

[enrich]
enabled = ["favicon"]
concurrency = 8

[storage]
assets_dir = "./assets"

[webui]
bind = "127.0.0.1:8080"

[signatures]
dir = "signatures"
disable = []
