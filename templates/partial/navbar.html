<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Logo / Site Name -->
      <div class="flex-shrink-0">
        <a href="/" class="text-2xl font-bold text-gray-800 hover:text-blue-600 transition">
          Minecraft Server Browser
        </a>
      </div>

      <!-- Desktop Navigation Links + Player Search -->
      <div class="hidden md:flex items-center space-x-6">
        <a href="/" class="text-gray-700 hover:text-blue-600 font-medium transition">Home</a>

        <!-- Player Search Form -->
        <form id="player-search-form" class="flex items-center space-x-2">
          <input id="player-search-input" type="text" placeholder="Go to player..."
                 class="px-3 py-1 border rounded-lg focus:outline-none focus:ring focus:border-blue-300 text-sm" />
          <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm">
            Go
          </button>
        </form>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center space-x-2">
        <button id="mobile-menu-button" class="text-gray-700 focus:outline-none p-2 rounded hover:bg-gray-100 transition">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
    <a href="/" class="block px-4 py-3 text-gray-700 hover:bg-gray-100 transition">Home</a>

    <!-- Player Search (Mobile) -->
    <form id="player-search-form-mobile" class="flex px-4 py-3 space-x-2">
      <input id="player-search-input-mobile" type="text" placeholder="Go to player..."
             class="flex-grow px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:border-blue-300 text-sm" />
      <button type="submit" class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm">
        Go
      </button>
    </form>
  </div>

  <script>
    // Mobile menu toggle
    document.getElementById("mobile-menu-button")?.addEventListener("click", function() {
      document.getElementById("mobile-menu")?.classList.toggle("hidden");
    });

    // Redirect to /player/{name} for desktop search
    document.getElementById("player-search-form")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("player-search-input").value.trim();
      if (name) window.location.href = `/player/${encodeURIComponent(name)}`;
    });

    // Redirect to /player/{name} for mobile search
    document.getElementById("player-search-form-mobile")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("player-search-input-mobile").value.trim();
      if (name) window.location.href = `/player/${encodeURIComponent(name)}`;
    });
  </script>
</nav>
